<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="رحلة تفاعلية مع مواقيت الصلوات الخمس وفق المعتمد في مذهب الحنابلة، مع شرح صوتي ونص مكتوب في كل محطة.">
<meta name="theme-color" content="#0a0f18">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0f18'/%3E%3Cpath d='M14 50V30a18 18 0 0 1 36 0v20' fill='none' stroke='%23c9a24e' stroke-width='4'/%3E%3Ccircle cx='32' cy='30' r='7' fill='%23e2c27a'/%3E%3C/svg%3E">
<title>الشمس تدق الجرس</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700;800&display=swap">
<style>
/* Layout: one-screen expedition app. Charcoal header with a five-node progress line; a full-bleed cinematic desert
   "day road" (right = الزوال, left = طلوع الشمس) graded by time of day; charcoal footer with caption + control pad.
   Each station opens a navy dossier: narration + transcript column beside an interactive scene. Single dark theme by choice. */
:root{
  --bg:#0a0f18; --navy:#101827; --navy-2:#162135; --char:#191c22; --char-2:#21252d; --line:#2d3444; --line-2:#3a4256;
  --text:#ece4d3; --muted:#a49c8b; --sand:#d8c6a2; --sand-2:#b59e76; --gold:#c9a24e; --gold-2:#e2c27a; --gold-soft:rgba(201,162,78,.16);
  --ikh:#3e9a8a; --dar:#c58637; --one:#5b80c2; --zawal:#8b7ac0; --grey:#5d6475;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.75;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
p{margin:0}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}

/* ---------- header ---------- */
.top{background:linear-gradient(180deg,#0d121c,#11161f);border-bottom:1px solid var(--line);padding-block:12px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
.brand{display:flex;flex-direction:column;min-width:0;gap:2px}
.brand h1{font-size:clamp(17px,2.2vw,23px);font-weight:800;color:var(--text)}
.brand h1 span{color:var(--gold-2)}
.brand small{font-size:12px;color:var(--muted)}
.progress{display:flex;align-items:flex-start;list-style:none;margin:0;padding:0}
.progress li{display:flex;align-items:flex-start}
.progress li+li::before{content:"";width:clamp(10px,3vw,34px);height:1px;background:var(--line-2);margin-top:9px}
.dot{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0 4px;color:var(--muted);font-size:11.5px;line-height:1.2}
.dot i{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);background:var(--char);display:grid;place-items:center;font-style:normal;font-size:10px;transition:all .35s}
.dot.visited i{border-color:var(--sand-2);background:var(--char-2)}
.dot.visited i::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--sand-2)}
.dot.current{color:var(--text)}
.dot.current i{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 4px rgba(201,162,78,.12)}
.dot.current i::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold-2)}
.sound{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--char);border-radius:8px;padding:5px 10px 5px 12px;font-size:13px;font-weight:600}
.toggle .sw{width:30px;height:16px;border-radius:8px;background:var(--line-2);position:relative;transition:background .25s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:transform .25s,background .25s}
.toggle[aria-pressed=true] .sw{background:rgba(201,162,78,.45)}
.toggle[aria-pressed=true] .sw::after{transform:translateX(-14px);background:var(--gold-2)}
.ghost{border:1px solid var(--line-2);background:transparent;border-radius:8px;padding:5px 12px;font-size:13px}
.vsel{max-width:180px;border:1px solid var(--line-2);background:var(--char);border-radius:8px;padding:4px 8px;font-size:12.5px}

/* ---------- stage ---------- */
.stage{position:relative;overflow:hidden;min-height:240px;outline:none;background:#0b111b}
.stage:focus-visible{box-shadow:inset 0 0 0 2px var(--gold)}
.sky{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
.sky-noon{background:linear-gradient(180deg,#2f5f8f 0%,#6f9cc4 45%,#c9d6dc 78%,#e3dccb 100%)}
.sky-afternoon{background:linear-gradient(180deg,#34557e 0%,#7d93ad 45%,#d6c3a0 80%,#e5c58e 100%)}
.sky-sunset{background:linear-gradient(180deg,#1d2643 0%,#4a3f5e 38%,#a35a4a 68%,#d88b55 86%,#e9b679 100%)}
.sky-night{background:linear-gradient(180deg,#05080f 0%,#0b1324 55%,#16223a 100%)}
.sky-dawn{background:linear-gradient(180deg,#070b16 0%,#16213a 50%,#4b5a7a 82%,#a9adb8 100%)}
.sky-sunrise{background:linear-gradient(180deg,#3d5f86 0%,#8ea6bd 50%,#e0cfae 82%,#f0c88c 100%)}
.stage[data-sky=noon] .sky-noon,.stage[data-sky=afternoon] .sky-afternoon,.stage[data-sky=sunset] .sky-sunset,
.stage[data-sky=night] .sky-night,.stage[data-sky=dawn] .sky-dawn,.stage[data-sky=sunrise] .sky-sunrise{opacity:1}
.stars{position:absolute;inset:0;opacity:0;transition:opacity 1.6s}
.stage[data-sky=night] .stars{opacity:.9}.stage[data-sky=dawn] .stars{opacity:.35}
.orb{position:absolute;border-radius:50%;transition:left 1.8s ease,top 1.8s ease,opacity 1.4s;opacity:0;pointer-events:none}
.sun{width:120px;height:120px;margin:-60px 0 0 -60px;background:radial-gradient(circle,#fff8e4 0 13%,#f6dfa4 16%,rgba(246,223,164,.35) 24%,rgba(246,223,164,.08) 45%,rgba(246,223,164,0) 70%)}
.moon{width:34px;height:34px;margin:-17px 0 0 -17px;background:transparent;box-shadow:-7px 5px 0 0 #e9e1c8;filter:drop-shadow(0 0 10px rgba(233,225,200,.35))}
.stage[data-sky=noon] .sun{left:50%;top:10%;opacity:1}
.stage[data-sky=afternoon] .sun{left:24%;top:30%;opacity:1}
.stage[data-sky=sunset] .sun{left:9%;top:60%;opacity:1;background:radial-gradient(circle,#ffe2b5 0 12%,#e98a4f 15%,rgba(233,138,79,.35) 24%,rgba(233,138,79,.08) 45%,rgba(233,138,79,0) 70%)}
.stage[data-sky=sunrise] .sun{left:90%;top:56%;opacity:1}
.stage[data-sky=night] .moon{left:74%;top:15%;opacity:1}
.stage[data-sky=dawn] .moon{left:28%;top:17%;opacity:.5}
#world{position:absolute;bottom:0;left:0;overflow:visible;transition:transform 1.1s cubic-bezier(.4,.05,.25,1)}
/* SVG labels: fixed base direction so anchors behave the same in every host page; the bidi algorithm still lays Arabic out right-to-left and joined */
#world text,.scene text{font-family:var(--f-body);direction:ltr;unicode-bidi:normal;letter-spacing:0;font-kerning:normal;writing-mode:horizontal-tb}
#world .gname{font-family:var(--f-display);font-weight:700}
.gate{cursor:pointer}
.poi-sky,.poi-sign{cursor:pointer}
.ring{fill:none;stroke:var(--gold-2);stroke-width:1.6;opacity:0;transition:opacity .35s}
.ring.on{opacity:1}
.grade{position:absolute;inset:0;pointer-events:none;transition:background 1.6s ease;mix-blend-mode:multiply}
.stage[data-sky=noon] .grade{background:rgba(255,255,255,0)}
.stage[data-sky=afternoon] .grade{background:rgba(214,170,120,.18)}
.stage[data-sky=sunset] .grade{background:rgba(120,60,70,.38)}
.stage[data-sky=night] .grade{background:rgba(14,22,48,.72)}
.stage[data-sky=dawn] .grade{background:rgba(30,40,74,.58)}
.stage[data-sky=sunrise] .grade{background:rgba(214,170,120,.14)}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.hint-float{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(10,14,22,.62);border:1px solid rgba(201,162,78,.25);color:var(--sand);font-size:12.5px;padding:5px 14px;border-radius:6px;white-space:nowrap;pointer-events:none;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(4px)}

/* ---------- footer ---------- */
.bottom{background:linear-gradient(0deg,#0d121c,#12171f);border-top:1px solid var(--line);padding-block:12px 14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 28px;align-items:center}
.caption{min-width:0;display:flex;flex-direction:column;gap:3px}
.caption .where{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.caption h2{font-size:19px;font-weight:700}
.caption .tag{font-size:12px;color:var(--gold-2)}
.caption .tip{color:var(--sand);min-height:1.75em;max-width:72ch}
.caption .tip b{color:var(--gold-2);font-weight:600}
.keys{font-size:12px;color:var(--muted)}
.keys kbd{font-family:var(--f-body);background:var(--char-2);border:1px solid var(--line-2);border-radius:4px;padding:0 6px;font-size:11.5px;color:var(--text)}
.pad{display:grid;grid-template-columns:repeat(3,auto);grid-template-areas:". up ." "prev down next" "enter enter esc";gap:6px;justify-content:end}
.pad button{min-width:46px;height:38px;border-radius:8px;border:1px solid var(--line-2);background:var(--char);display:grid;place-items:center;font-size:13px;font-weight:600;padding:0 12px;transition:border-color .2s,background .2s}
.pad button:hover{border-color:var(--sand-2)}
.pad button:active{background:var(--char-2)}
.pad svg{width:16px;height:16px}
.pad .up{grid-area:up}.pad .down{grid-area:down}.pad .prev{grid-area:prev}.pad .next{grid-area:next}
.pad .enter{grid-area:enter;background:var(--gold);color:#16130c;border-color:var(--gold)}
.pad .esc{grid-area:esc}

/* ---------- dialog ---------- */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(4,7,12,.78);backdrop-filter:blur(3px);display:grid;place-items:center;
  padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.win{background:var(--navy);color:var(--text);width:100%;max-width:1100px;max-height:100%;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6);outline:none;animation:rise .45s cubic-bezier(.3,.1,.2,1)}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.win-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 22px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#131d2f,#101827)}
.kicker{font-size:12px;color:var(--gold-2)}
.win-head h2{font-size:clamp(22px,3vw,30px);font-weight:800}
.x{border:1px solid var(--line-2);background:transparent;border-radius:8px;width:38px;height:38px;font-size:20px;line-height:1;flex:none;color:var(--sand)}
.win-body{overflow:auto;padding:18px 22px 20px;overscroll-behavior:contain}
.win-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:12px 22px 14px;border-top:1px solid var(--line);background:#0e1522}
.btn{border:1px solid var(--line-2);background:var(--char);border-radius:8px;padding:7px 16px;font-weight:600;font-size:14px;color:var(--text)}
.btn:hover:not(:disabled){border-color:var(--sand-2)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#16130c}
.btn.play[aria-pressed=true]{border-color:var(--gold);color:var(--gold-2)}
.w-grid{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(0,1.65fr);gap:20px;align-items:start}
.w-main{min-width:0;display:flex;flex-direction:column;gap:12px}
.w-main>*{flex-shrink:0}
.scene{width:100%;max-width:100%;height:auto;display:block;border-radius:8px;background:#0b111b;touch-action:none;border:1px solid var(--line)}
.scene-wrap{position:relative;width:min(100%,max(300px,calc((100dvh - 330px) * var(--ar,1.778))));margin-inline:auto}
.scene-note{position:absolute;inset-inline-start:10px;top:7px;font-size:11px;color:rgba(236,228,211,.6);pointer-events:none}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ctrl input[type=range]{flex:1 1 220px;min-width:0;accent-color:var(--gold);height:26px}
.status{display:flex;align-items:center;gap:10px;font-weight:600;background:var(--navy-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:44px;color:var(--text)}
.status i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--grey);box-shadow:0 0 0 3px rgba(255,255,255,.04)}
.status[data-ph=one] i{background:var(--one)}.status[data-ph=ikh] i{background:var(--ikh)}.status[data-ph=dar] i{background:var(--dar)}.status[data-ph=zawal] i{background:var(--zawal)}
.phase{position:relative;height:26px;border-radius:5px;overflow:hidden;background:var(--char-2);direction:rtl}
.phase span{position:absolute;top:0;bottom:0;display:grid;place-items:center;font-size:11.5px;font-weight:600;color:#f4efe4;white-space:nowrap;overflow:hidden}
.phase .pin{position:absolute;top:-2px;bottom:-2px;width:3px;margin-right:-1.5px;background:var(--gold-2);box-shadow:0 0 0 2px rgba(10,15,24,.8)}
.c-one{background:var(--one)}.c-ikh{background:var(--ikh)}.c-dar{background:var(--dar)}.c-grey{background:var(--grey)}.c-zawal{background:var(--zawal)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);list-style:none;padding:0;margin:0}
.legend li{display:flex;align-items:center;gap:7px}
.legend i{width:16px;height:6px;border-radius:2px;display:inline-block}
.meter{display:flex;flex-direction:column;gap:4px}
.meter .lbl{font-size:12.5px;color:var(--muted)}
.meter .track{position:relative;height:8px;border-radius:4px;background:var(--char-2);direction:rtl}
.meter .fill{position:absolute;top:0;bottom:0;right:0;border-radius:4px;background:var(--one);transition:background .2s}
.meter .tick{position:absolute;top:-5px;bottom:-5px;width:1px;background:var(--sand)}
.meter .ticks{position:relative;height:18px;font-size:11.5px;color:var(--muted);direction:rtl}
.meter .ticks span{position:absolute;transform:translateX(50%);white-space:nowrap}
details{background:var(--navy-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
details summary{cursor:pointer;font-weight:600;color:var(--sand)}
details p,details ul{margin-top:6px;max-width:72ch;color:var(--text)}
.foot-note{font-size:12.5px;color:var(--muted);border-inline-start:2px solid var(--gold);padding-inline-start:10px}
.quote{font-family:var(--f-display);font-weight:600;font-size:clamp(17px,2.2vw,21px);line-height:1.85;background:linear-gradient(135deg,#1a2438,#131b2b);border:1px solid rgba(201,162,78,.35);color:var(--text);border-radius:10px;padding:16px 20px;margin:0}
.quote em{font-style:normal;color:var(--gold-2)}
.wide{overflow-x:auto;border-radius:8px}
.wide svg{min-width:620px;display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.card{background:var(--navy-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;min-width:0}
.card h3{font-size:16px;margin-bottom:4px;color:var(--sand)}
.card p{line-height:1.65}
.card .k{font-weight:600;color:var(--muted)}
.card .k.ikh{color:#6cc3b1}.card .k.dar{color:#e0a35a}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;background:var(--char);padding:3px;gap:3px;flex-wrap:wrap;align-self:flex-start}
.seg button{border:0;background:none;border-radius:6px;padding:5px 14px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--gold);color:#16130c}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.cmp .card{display:flex;flex-direction:column;gap:8px;padding:14px}
.row{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px;align-items:start;transition:opacity .35s}
.row.dim{opacity:.22}
.row .who{font-weight:700;font-size:13px;padding-top:2px;color:var(--sand)}
.bar{position:relative;height:16px;border-radius:4px;overflow:hidden;display:flex;direction:rtl}
.bar b{display:block;height:100%}
.bar-l{position:relative;height:18px;font-size:11.5px;color:var(--muted);direction:rtl}
.bar-l span{position:absolute;transform:translateX(50%);white-space:nowrap}
.ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.by{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:7px}
.r-txt{font-size:13.5px}
.end-quote{font-family:var(--f-display);font-weight:700;font-size:clamp(19px,2.6vw,27px);line-height:1.9;text-align:center;padding:30px 22px;border-radius:10px;color:var(--text);border:1px solid rgba(201,162,78,.35);
  background:radial-gradient(120% 80% at 50% 120%,rgba(224,170,100,.45) 0,rgba(120,70,60,.35) 30%,rgba(22,33,53,0) 70%),linear-gradient(180deg,#0e1626,#18233a)}
.end-quote span{color:var(--gold-2)}
.intro-list{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}

/* ---------- narration card ---------- */
.audio{position:sticky;top:0;background:linear-gradient(180deg,#141e31,#121a2a);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.a-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.a-head h3{font-size:14px;color:var(--gold-2);font-weight:700}
.a-row{display:flex;flex-wrap:wrap;gap:6px}
.a-row .btn{padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.a-row svg{width:13px;height:13px}
.a-prog{height:4px;border-radius:2px;background:var(--char-2);overflow:hidden}
.a-prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s linear}
.a-meta{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.a-note{font-size:12.5px;color:var(--sand);background:rgba(201,162,78,.08);border:1px solid rgba(201,162,78,.22);border-radius:6px;padding:6px 10px}
.transcript{font-size:15.5px;line-height:1.95;color:var(--text);max-width:70ch}
.transcript span{transition:background .3s,color .3s;border-radius:3px;padding:0 1px}
.transcript span.now{background:rgba(201,162,78,.2);color:#fff6df}
.transcript span.done{color:#cfc6b3}
.tr-label{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}

@media (max-width:860px){
  .w-grid{grid-template-columns:minmax(0,1fr)}
  .audio{position:static}
}
@media (max-width:760px){
  body{font-size:14.5px}
  .bottom{grid-template-columns:minmax(0,1fr)}
  .pad{justify-content:center;grid-template-columns:repeat(4,auto);grid-template-areas:"prev up down next" "enter enter esc esc"}
  .pad button{height:38px;min-width:54px}
  .caption h2{font-size:17px}
  .keys{display:none}

/* ================= input ================= */
const NATIVE_ENTER = el => el && el !== win && el.matches && el.matches("button, a, summary, select");
document.addEventListener("keydown", e => {
  const k = e.key;
  if (e.code === "KeyM" && !e.ctrlKey && !e.metaKey && !e.altKey && !(document.activeElement && document.activeElement.tagName === "SELECT")) { e.preventDefault(); setSound(!V.on); return; }
  if (openId) {
    if (k === "Escape") { e.preventDefault(); closeWin(); return; }
    if (k === "ArrowLeft" || k === "ArrowRight") { e.preventDefault(); ctl && ctl.step(k === "ArrowLeft" ? 1 : -1); return; }
    if (k === "ArrowUp" || k === "ArrowDown") { e.preventDefault(); body.scrollBy({ top: k === "ArrowUp" ? -70 : 70, behavior: "smooth" }); return; }
    if (k === "Enter") { if (NATIVE_ENTER(document.activeElement)) return; e.preventDefault(); ctl && ctl.play && ctl.play(); }
    return;
  }
  if (document.activeElement && document.activeElement.tagName === "SELECT") return;
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(k)) {
    e.preventDefault();
    if (k === "ArrowLeft") go(cur + 1); else if (k === "ArrowRight") go(cur - 1);
    else if (k === "ArrowUp") { poi = Math.max(0, poi - 1); render(); } else { poi = Math.min(2, poi + 1); render(); }
    return;
  }
  if (k === "Enter") { if (NATIVE_ENTER(document.activeElement)) return; e.preventDefault(); activate(); return; }
  if (k === "Escape" && poi !== 1) { poi = 1; render(); }
});
document.querySelectorAll(".pad button").forEach(b => b.addEventListener("click", () => {
  const a = b.dataset.act;
  if (a === "next") go(cur + 1); else if (a === "prev") go(cur - 1);
  else if (a === "up") { poi = Math.max(0, poi - 1); render(); } else if (a === "down") { poi = Math.min(2, poi + 1); render(); }
  else if (a === "enter") activate(); else if (a === "esc") { poi = 1; render(); }
}));
(() => { let sx = null; const st = $("#stage");
  st.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  st.addEventListener("touchend", e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) go(cur + (dx > 0 ? 1 : -1)); sx = null; }, { passive: true });
})();
document.addEventListener("visibilitychange", () => { if (document.hidden) pauseSpeech(); });
window.addEventListener("pagehide", () => { try { speechSynthesis.cancel(); } catch (e) { } });

buildWorld(); stars(); buildProgress();
window.addEventListener("resize", layout);
$("#world").style.transition = "none";
render(); syncMute();
requestAnimationFrame(() => requestAnimationFrame(() => { $("#world").style.transition = ""; }));
$("#stage").focus({ preventScroll: true });
})();
</script>
</body>
</html>
